<!DOCTYPE html>
<html lang="fr">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<head>
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heures Sup Solami</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f8;
margin:0;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#1f4e78;
}

input{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
box-sizing:border-box;
border:1px solid #ccc;
border-radius:8px;
}

button{
padding:10px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
margin:2px;
}

.btn-ajout{
background:#1f4e78;
color:white;
width:100%;
}

.btn-delete{
background:#dc3545;
color:white;
}

.btn-edit{
background:#f0ad4e;
color:white;
}

.btn-mail{
background:#198754;
color:white;
width:100%;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
font-size:12px;
}

th{
background:#1f4e78;
color:white;
}
</style>
</head>

<body>

<div class="container">

<h1>Heures Sup Solami</h1>

<div class="card">

<label>Technicien</label>
<input type="text" id="technicien" value="Joan">

<label>Date</label>
<input type="date" id="date">

<label>Chantier</label>
<input type="text" id="chantier">

<label>Heure début</label>
<input type="time" id="debut">

<label>Heure fin</label>
<input type="time" id="fin">

<label>Pause (minutes)</label>
<input type="number" id="pause" value="60">

<label>Kilomètres</label>
<input type="number" id="km">

<button class="btn-ajout" onclick="ajouter()">
➕ Ajouter
</button>

</div>

<div class="card">
<h3>Total Heures Supp : <span id="totalHS">0</span> h</h3>
<h3>Total Km : <span id="totalKM">0</span> km</h3>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Date</th>
<th>Technicien</th>
<th>HS</th>
<th>Km</th>
<th>Chantier</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tableau"></tbody>
</table>
</div>

<div class="card">
<button class="btn-mail" onclick="exportMail()">
📧 Exporter le récapitulatif
</button>
<button class="btn-mail" onclick="exportPDF()">
📄 Export PDF
</button>
</div>

</div>

<script>

let donnees = JSON.parse(localStorage.getItem("solami")) || [];
let edition = -1;

function calculHS(debut, fin, pause){

let d = debut.split(":");
let f = fin.split(":");

let minutes =
(f[0]*60 + Number(f[1])) -
(d[0]*60 + Number(d[1])) -
Number(pause);

let heures = minutes / 60;

return Math.max(0, heures - 7);

}

function ajouter(){

let technicien = document.getElementById("technicien").value;
let date = document.getElementById("date").value;
let chantier = document.getElementById("chantier").value;
let debut = document.getElementById("debut").value;
let fin = document.getElementById("fin").value;
let pause = document.getElementById("pause").value;
let km = Number(document.getElementById("km").value || 0);

if(!date || !debut || !fin){
alert("Complète les champs.");
return;
}

let hs = calculHS(debut,fin,pause);

let ligne = {
technicien,
date,
chantier,
km,
hs,
debut,
fin,
pause
};

if(edition >= 0){
donnees[edition] = ligne;
edition = -1;
}else{
donnees.push(ligne);
}

localStorage.setItem("solami",JSON.stringify(donnees));

viderFormulaire();
afficher();

}

function modifier(index){

let ligne = donnees[index];

document.getElementById("technicien").value = ligne.technicien;
document.getElementById("date").value = ligne.date;
document.getElementById("chantier").value = ligne.chantier;
document.getElementById("debut").value = ligne.debut;
document.getElementById("fin").value = ligne.fin;
document.getElementById("pause").value = ligne.pause;
document.getElementById("km").value = ligne.km;

edition = index;

}

function supprimer(index){

if(confirm("Supprimer cette ligne ?")){

donnees.splice(index,1);

localStorage.setItem("solami",
JSON.stringify(donnees));

afficher();

}

}

function viderFormulaire(){

document.getElementById("date").value="";
document.getElementById("chantier").value="";
document.getElementById("debut").value="";
document.getElementById("fin").value="";
document.getElementById("km").value="";

}

function exportMail(){

let texte = "Récapitulatif heures supplémentaires\n\n";

donnees.forEach(ligne => {

texte +=
ligne.date +
" | " +
ligne.technicien +
" | " +
ligne.chantier +
" | HS : " +
ligne.hs.toFixed(2) +
"h | KM : " +
ligne.km +
"\n";

});

window.location.href =
"mailto:?subject=Récap Heures Sup&body=" +
encodeURIComponent(texte);

}

function afficher(){

let html="";
let totalHS=0;
let totalKM=0;

donnees.forEach((ligne,index)=>{

totalHS += Number(ligne.hs);
totalKM += Number(ligne.km);

html += `
<tr>
<td>${ligne.date}</td>
<td>${ligne.technicien}</td>
<td>${ligne.hs.toFixed(2)}</td>
<td>${ligne.km}</td>
<td>${ligne.chantier}</td>
<td>
<button class="btn-edit" onclick="modifier(${index})">✏️</button>
<button class="btn-delete" onclick="supprimer(${index})">🗑️</button>
</td>
</tr>
`;

});

document.getElementById("tableau").innerHTML = html;
document.getElementById("totalHS").innerText = totalHS.toFixed(2);
document.getElementById("totalKM").innerText = totalKM;

}
function exportPDF(){

const { jsPDF } = window.jspdf;

const doc = new jsPDF();

doc.setFontSize(16);
doc.text("Rapport Heures Sup - Joan", 10, 15);

let y = 30;

donnees.forEach((ligne) => {

doc.setFontSize(10);

doc.text(
`${ligne.date} | ${ligne.technicien} | ${ligne.chantier} | HS : ${ligne.hs.toFixed(2)} h | KM : ${ligne.km}`,
10,
y
);

y += 8;

if(y > 270){
doc.addPage();
y = 20;
}

});

doc.save("Rapport_Heures_Sup.pdf");

}
afficher();

</script>

</body>
</html>
