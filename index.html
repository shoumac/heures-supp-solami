<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="logo.jpeg">
<link rel="icon" type="image/jpeg" href="logo.jpeg">
<title>Heures Sup Solami V3</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.logo{
text-align:center;
margin-bottom:30px;
}

.logo h1{
font-size:40px;
font-weight:700;
color:#38bdf8;
}

.logo p{
color:#94a3b8;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

.card h3{
font-size:14px;
color:#94a3b8;
margin-bottom:10px;
}

.card .value{
font-size:32px;
font-weight:700;
}

.formulaire{
background:#1e293b;
padding:25px;
border-radius:20px;
margin-bottom:25px;
}

.formulaire h2{
margin-bottom:20px;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border:none;
border-radius:10px;
background:#334155;
color:white;
}

button{
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.btn-ajouter{
background:#38bdf8;
color:black;
width:100%;
}

.table-card{
background:#1e293b;
padding:20px;
border-radius:20px;
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#334155;
padding:12px;
}

td{
padding:10px;
text-align:center;
border-bottom:1px solid #334155;
}

.btn-delete{
background:#ef4444;
color:white;
}

.btn-edit{
background:#f59e0b;
color:white;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<img
src="logo appli.jpeg"
alt="Logo HS Solami"
style="
width:120px;
height:120px;
border-radius:25px;
margin-bottom:15px;
box-shadow:0 0 30px rgba(56,189,248,.4);
">

<h1>HS SOLAMI</h1>
<p>Gestion Heures Supplémentaires & Équipe</p>

</div>

<div class="dashboard">

<div class="card">
<h3>Heures Supp</h3>
<div class="value" id="totalHS">0</div>
</div>

<div class="card">
<h3>Kilomètres</h3>
<div class="value" id="totalKM">0</div>
</div>

<div class="card">
<h3>Semaine</h3>
<div class="value" id="totalSemaine">0</div>
</div>

<div class="card">
<h3>Mois</h3>
<div class="value" id="totalMois">0</div>
</div>

</div>

<!-- FORMULAIRE -->

<div class="formulaire">

<h2>Nouvelle Intervention</h2>

<label>Technicien</label>
<select id="technicien">
<option>Joan</option>
<option>Technicien 2</option>
<option>Technicien 3</option>
</select>

<label>Date</label>
<input type="date" id="date">

<label>Type d'intervention</label>
<select id="type">
<option>Installation</option>
<option>SAV</option>
<option>Maintenance</option>
<option>Dépannage</option>
</select>

<label>Nom du chantier</label>
<input type="text" id="chantier">

<label>Heure début</label>
<input type="time" id="debut">

<label>Heure fin</label>
<input type="time" id="fin">

<label>Pause (minutes)</label>
<input type="number" id="pause" value="60">

<label>Kilomètres</label>
<input type="number" id="km">

<label>Prime panier (€)</label>
<input type="number" id="panier" value="0">

<label>Prime déplacement (€)</label>
<input type="number" id="deplacement" value="0">

<label>Notes</label>
<textarea id="notes" rows="4"></textarea>

<button class="btn-ajouter">
➕ Ajouter Intervention
</button>

</div>

<!-- ACTIONS -->

<div class="dashboard">

<div class="card">
<button style="width:100%;background:#22c55e;color:white;">
📧 Export Mail
</button>
</div>

<div class="card">
<button style="width:100%;background:#ef4444;color:white;">
📄 Export PDF
</button>
</div>

</div>

<!-- TABLEAU -->

<div class="table-card">

<h2>Historique Équipe</h2> 

<table>

<thead>

<tr>
<th>Date</th>
<th>Technicien</th>
<th>Type</th>
<th>HS</th>
<th>KM</th>
<th>Action</th>
</tr>

</thead>

<tbody id="tableau">

</tbody>

</table>

</div>

</div>

</div>

<script>

let donnees = JSON.parse(localStorage.getItem("hs_solami")) || [];

function calculHS(debut, fin, pause){

if(!debut || !fin) return 0;

let d = debut.split(":");
let f = fin.split(":");

let minutes =
((Number(f[0]) * 60) + Number(f[1])) -
((Number(d[0]) * 60) + Number(d[1])) -
Number(pause);

let heuresTravaillees = minutes / 60;

return Math.max(0, heuresTravaillees - 7);

}

function ajouterIntervention(){

const ligne = {

date: document.getElementById("date").value,
technicien: document.getElementById("technicien").value,
type: document.getElementById("type").value,
chantier: document.getElementById("chantier").value,
debut: document.getElementById("debut").value,
fin: document.getElementById("fin").value,
pause: Number(document.getElementById("pause").value || 0),
km: Number(document.getElementById("km").value || 0),
panier: Number(document.getElementById("panier").value || 0),
deplacement: Number(document.getElementById("deplacement").value || 0),
notes: document.getElementById("notes").value

};

if(
!ligne.date ||
!ligne.chantier ||
!ligne.debut ||
!ligne.fin
){
alert("Veuillez remplir tous les champs obligatoires");
return;
}

ligne.hs = calculHS(
ligne.debut,
ligne.fin,
ligne.pause
);

donnees.push(ligne);

localStorage.setItem(
"hs_solami",
JSON.stringify(donnees)
);

viderFormulaire();
afficher();

}

function viderFormulaire(){

document.getElementById("chantier").value="";
document.getElementById("debut").value="";
document.getElementById("fin").value="";
document.getElementById("km").value="";
document.getElementById("notes").value="";

}

function supprimer(index){

if(!confirm("Supprimer cette intervention ?"))
return;

donnees.splice(index,1);

localStorage.setItem(
"hs_solami",
JSON.stringify(donnees)
);

afficher();

}

function afficher(){

let html = "";

let totalHS = 0;
let totalKM = 0;

donnees.forEach((ligne,index)=>{

totalHS += Number(ligne.hs);
totalKM += Number(ligne.km);

html += `
<tr>
<td>${ligne.date}</td>
<td>${ligne.technicien}</td>
<td>${ligne.type}</td>
<td>${ligne.hs.toFixed(2)} h</td>
<td>${ligne.km}</td>
<td>
<button class="btn-delete"
onclick="supprimer(${index})">
🗑️
</button>
</td>
</tr>
`;

});

document.getElementById("tableau").innerHTML = html;

document.getElementById("totalHS").innerText =
totalHS.toFixed(2);

document.getElementById("totalKM").innerText =
totalKM;

document.getElementById("totalSemaine").innerText =
totalHS.toFixed(2);

document.getElementById("totalMois").innerText =
totalHS.toFixed(2);

}

function exportCSV(){

let csv =
"Date;Technicien;Type;Chantier;HS;KM\n";

donnees.forEach(ligne=>{

csv +=
`${ligne.date};${ligne.technicien};${ligne.type};${ligne.chantier};${ligne.hs};${ligne.km}\n`;

});

let blob =
new Blob([csv], {
type:"text/csv;charset=utf-8;"
});

let link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"HS_SOLAMI.csv";

link.click();

}

function exportPDF(){

window.print();

}

document
.querySelector(".btn-ajouter")
.addEventListener(
"click",
ajouterIntervention
);

const boutons =
document.querySelectorAll("button");

boutons.forEach(btn=>{

if(btn.textContent.includes("PDF")){
btn.onclick = exportPDF;
}

if(btn.textContent.includes("Mail")){
btn.onclick = exportCSV;
}

});

afficher();

</script>

</body>
</html>
